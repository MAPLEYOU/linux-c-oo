<svg width="680" height="232" viewBox="0 0 680 232" role="img" xmlns="http://www.w3.org/2000/svg">
<title>为何要先转 void 的计数单位对比</title>
<desc>指针减法按元素大小步进，必须先转成字节指针才能按字节数减偏移</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="232" fill="#ffffff"/>

<text x="40" y="34" font-size="14" font-weight="500" fill="#2C2C2A">指针的「1」不是 1 字节，而是 1 个元素</text>

<rect x="40" y="56" width="290" height="120" rx="12" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="60" y="82" font-size="12" font-weight="500" fill="#A32D2D">❌ 直接减 offsetof</text>
<text x="60" y="106" font-size="12" fill="#A32D2D" font-family="monospace">p - 8</text>
<text x="60" y="128" font-size="11" fill="#A32D2D">若 p 是 struct item*（size 8）</text>
<text x="60" y="148" font-size="11" fill="#A32D2D">实际后退 8 × 8 = 64 字节</text>
<text x="60" y="168" font-size="11" fill="#A32D2D" font-weight="500">结果越过了目标，读到垃圾</text>

<rect x="350" y="56" width="290" height="120" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="370" y="82" font-size="12" font-weight="500" fill="#0F6E56">✅ 先转字节指针</text>
<text x="370" y="106" font-size="12" fill="#0F6E56" font-family="monospace">(char *)p - 8</text>
<text x="370" y="128" font-size="11" fill="#0F6E56">char 的 size 恒为 1</text>
<text x="370" y="148" font-size="11" fill="#0F6E56">所以「1」= 1 字节</text>
<text x="370" y="168" font-size="11" fill="#0F6E56" font-weight="500">精确后退 8 字节 → 命中目标 ✔</text>

<rect x="40" y="190" width="600" height="30" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="60" y="210" font-size="12" fill="#854F0B" font-family="monospace">container_of 里写 (void *) 或 (char *) 都行：关键是把「刻度」换成字节</text>
</svg>
