<svg width="680" height="262" viewBox="0 0 680 262" role="img" xmlns="http://www.w3.org/2000/svg">
<title>container_of 的指针步进陷阱</title>
<desc>元素指针减一会退元素大小字节，字节指针才能按精确偏移退回宿主起点</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="262" fill="#ffffff"/>
<text x="40" y="36" font-size="13" font-weight="500" fill="#2C2C2A">一个 struct box 对象，三个指针位置</text>
<text x="170" y="68" font-size="12" fill="#5F5E5A" text-anchor="end">偏移</text>
<text x="200" y="68" font-size="12" fill="#5F5E5A" text-anchor="middle">0</text>
<text x="260" y="68" font-size="12" fill="#185FA5" text-anchor="middle">4</text>
<text x="380" y="68" font-size="12" fill="#5F5E5A" text-anchor="middle">12</text>
<text x="440" y="68" font-size="12" fill="#5F5E5A" text-anchor="middle">16</text>
<rect x="200" y="84" width="60" height="60" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
<rect x="260" y="84" width="120" height="60" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<rect x="380" y="84" width="60" height="60" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
<line x1="320" y1="86" x2="320" y2="142" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="230" y="114" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">tag</text>
<text x="290" y="114" font-size="12" fill="#042C53" text-anchor="middle" dominant-baseline="central">a</text>
<text x="350" y="114" font-size="12" fill="#042C53" text-anchor="middle" dominant-baseline="central">b</text>
<text x="410" y="114" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">magic</text>
<line x1="200" y1="144" x2="200" y2="196" stroke="#1D9E75" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="260" y1="144" x2="260" y2="246" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="194" y="166" font-size="12" fill="#0F6E56" text-anchor="end">&amp;b</text>
<text x="266" y="166" font-size="12" fill="#185FA5">p = &amp;b.it</text>
<line x1="260" y1="192" x2="204" y2="192" stroke="#1D9E75" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="232" y="182" font-size="12" fill="#0F6E56" text-anchor="middle">(char *)p − 4 ✓</text>
<line x1="260" y1="240" x2="144" y2="240" stroke="#E24B4A" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="202" y="230" font-size="12" fill="#A32D2D" text-anchor="middle">p − 1 退了 8 字节 ✗</text>
</svg>
