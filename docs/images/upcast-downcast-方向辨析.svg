<svg width="680" height="298" viewBox="0 0 680 298" role="img" xmlns="http://www.w3.org/2000/svg">
<title>向上向下转型的方向坐标系辨析</title>
<desc>upcast 与 downcast 的方向只取决于指针类型从谁变到谁，与内存地址高低无关</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="298" fill="#ffffff"/>

<text x="40" y="34" font-size="14" font-weight="500" fill="#2C2C2A">方向由「类型树」决定，不由「地址」决定</text>
<text x="40" y="54" font-size="12" fill="#5F5E5A">类图越往上越抽象，越往下越具体。指针类型变抽象 = upcast，变具体 = downcast。</text>

<rect x="240" y="76" width="200" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="100" font-size="13" fill="#0C447C" font-family="monospace" text-anchor="middle">struct device</text>
<text x="340" y="119" font-size="11" fill="#185FA5" text-anchor="middle">父类 / 更抽象</text>

<rect x="240" y="188" width="200" height="56" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="340" y="212" font-size="13" fill="#854F0B" font-family="monospace" text-anchor="middle">struct i2c_client</text>
<text x="340" y="231" font-size="11" fill="#854F0B" text-anchor="middle">子类 / 更具体</text>

<path d="M228 104 L 228 216" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="212" y="150" font-size="12" fill="#185FA5" text-anchor="end" font-weight="500">upcast ↑</text>
<text x="212" y="170" font-size="11" fill="#185FA5" text-anchor="end">子 → 父</text>
<text x="212" y="188" font-size="11" fill="#185FA5" text-anchor="end">零成本</text>

<path d="M452 216 L 452 104" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="468" y="150" font-size="12" fill="#854F0B" font-weight="500">downcast ↓</text>
<text x="468" y="170" font-size="11" fill="#854F0B">父 → 子</text>
<text x="468" y="188" font-size="11" fill="#854F0B">需 container_of</text>

<rect x="40" y="256" width="600" height="30" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="60" y="276" font-size="12" fill="#2C2C2A">⚠️ 父类指针的地址通常 == 子类指针地址，看地址高低判断方向是错的</text>
</svg>
